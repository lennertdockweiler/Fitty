<style>
/* ---- styles.css ---- */
/* Layout: One-Screen-App mit Bottom-Tabs; Outfits als Etiketten mit Farbstreifen; Dresscode als Maßband */
:root {
  --bg: #E9EDF1; --surface: #F6F8FA; --raised: #FFFFFF; --ink: #131E2B; --muted: #586575; --line: #C6CED7;
  --accent: #D9A21B; --accent-ink: #1B1406; --tape: #E3B23A; --tape-ink: #2A2008;
  --ok: #24704D; --warn: #A8480F; --bad: #B3262E; --ctl: #131E2B; --ctl-ink: #F4F7FA;
  --f-display: 'Archivo', 'Arial Narrow', Arial, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'DM Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1620; --surface: #142030; --raised: #192738; --ink: #E8EDF2; --muted: #92A0AE; --line: #263647;
    --accent: #E3B53D; --accent-ink: #1B1406; --tape: #D9A82E; --tape-ink: #241A05;
    --ok: #4FBF8B; --warn: #E39A5C; --bad: #F06A72; --ctl: #E8EDF2; --ctl-ink: #0D1620; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1620; --surface: #142030; --raised: #192738; --ink: #E8EDF2; --muted: #92A0AE; --line: #263647;
  --accent: #E3B53D; --accent-ink: #1B1406; --tape: #D9A82E; --tape-ink: #241A05;
  --ok: #4FBF8B; --warn: #E39A5C; --bad: #F06A72; --ctl: #E8EDF2; --ctl-ink: #0D1620; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-block: 0 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 720px; margin: 0 auto; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1, h2, h3 { margin: 0; font-weight: 700; text-wrap: balance; }

header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 18px 0 10px; }
.brand { font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; }
.sync { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; color: var(--muted); text-align: right; }

nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
}
nav.tabs button { background: none; border: 0; padding: 8px 4px 6px; display: grid; justify-items: center; gap: 3px; color: var(--muted); font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; border-radius: 4px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); }
nav.tabs button[aria-selected="true"] .tick { background: var(--accent); width: 28px; }
nav.tabs .tick { height: 3px; width: 10px; background: var(--line); transition: width .2s; }
nav.tabs svg { width: 22px; height: 22px; }

.panel[hidden] { display: none; }
.sec { margin-top: 22px; }
.sec > .mono { display: block; margin-bottom: 8px; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 0; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

/* Maßband */
.tape { position: relative; background: var(--tape); color: var(--tape-ink); border-radius: 3px; display: grid; grid-template-columns: repeat(7, 1fr); overflow: hidden; box-shadow: inset 0 -2px 0 rgba(0,0,0,.12); }
.tape button { background: none; border: 0; border-right: 1px solid rgba(42,32,8,.35); padding: 22px 0 8px; display: grid; gap: 2px; justify-items: center; color: inherit; position: relative; min-width: 0; }
.tape button:last-child { border-right: 0; }
.tape button::before { content: ""; position: absolute; top: 0; left: 50%; width: 1px; height: 10px; background: currentColor; }
.tape button::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, currentColor 0 1px, transparent 1px 25%); opacity: .55; }
.tape .n { font-family: var(--f-mono); font-weight: 500; font-size: 16px; line-height: 1; }
.tape .l { font-size: 10px; line-height: 1.1; text-align: center; padding: 0 2px; overflow-wrap: anywhere; }
.tape button[aria-pressed="true"] { background: var(--ctl); color: var(--accent); }
.tape button[aria-pressed="true"]::after { opacity: 0; }
.tape button[aria-pressed="true"]::before { height: 6px; }
.lvl-name { font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 20px; margin-top: 10px; }

/* Bedienelemente */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 4px; padding: 7px 11px; font-size: 14px; min-height: 36px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"], .chip.on { background: var(--ctl); color: var(--ctl-ink); border-color: var(--ctl); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--raised); }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 9px 4px; font-size: 14px; min-width: 0; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ctl); color: var(--ctl-ink); }
.btn { border: 1px solid var(--ctl); background: var(--ctl); color: var(--ctl-ink); border-radius: 4px; padding: 11px 16px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.small { min-height: 36px; padding: 7px 12px; font-size: 14px; }
.btn.block { width: 100%; font-size: 16px; min-height: 52px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg, .chip svg { width: 18px; height: 18px; flex: none; }
input[type="text"], input[type="search"], select, textarea { width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-height: 44px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }
label.field { display: grid; gap: 6px; }
.temp { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 34px; line-height: 1; }
.check { display: flex; gap: 10px; align-items: center; min-height: 36px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* Teile */
.thumb { width: 100%; aspect-ratio: 1; border-radius: 4px; background: var(--c, #888); position: relative; overflow: hidden; display: grid; place-items: end start; border: 1px solid rgba(128,128,128,.35); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.thumb.streifen { background-image: repeating-linear-gradient(90deg, transparent 0 7px, rgba(255,255,255,.28) 7px 9px); }
.thumb.karo { background-image: repeating-linear-gradient(90deg, transparent 0 9px, rgba(255,255,255,.22) 9px 11px), repeating-linear-gradient(0deg, transparent 0 9px, rgba(255,255,255,.22) 9px 11px); }
.thumb.print { background-image: radial-gradient(circle at 30% 35%, rgba(255,255,255,.35) 0 14%, transparent 15%); }
.thumb .tl { position: relative; font-family: var(--f-mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 5px; color: #fff; background: rgba(0,0,0,.55); border-radius: 0 3px 0 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.closet { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.gcard { background: none; border: 0; padding: 0; text-align: left; display: grid; gap: 6px; align-content: start; min-width: 0; }
.gcard .nm { font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.gcard.off .thumb { opacity: .45; }
.badges { position: absolute; top: 4px; right: 4px; display: flex; gap: 3px; z-index: 1; }
.badge { font-family: var(--f-mono); font-size: 10px; background: var(--ctl); color: var(--ctl-ink); border-radius: 3px; padding: 1px 5px; }
.badge.star { background: var(--accent); color: var(--accent-ink); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; box-shadow: 0 0 0 1px rgba(128,128,128,.5); background: var(--c); padding: 0; }
.sw[aria-pressed="true"] { border-color: var(--raised); box-shadow: 0 0 0 3px var(--ink); }

/* Outfit-Etikett */
.outfit { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; display: grid; grid-template-columns: 14px 1fr; overflow: hidden; box-shadow: 0 1px 0 rgba(19,30,43,.05); }
.spine { display: grid; grid-auto-rows: 1fr; }
.spine i { background: var(--c); display: block; }
.o-body { padding: 14px; display: grid; gap: 12px; min-width: 0; }
.o-head { display: flex; justify-content: space-between; align-items: end; gap: 12px; }
.o-title { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 20px; }
.fit { display: grid; gap: 3px; justify-items: end; min-width: 92px; }
.fit b { font-family: var(--f-mono); font-weight: 500; font-size: 18px; }
.fit .bar { width: 92px; height: 8px; background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 9.2px); position: relative; border-bottom: 2px solid var(--line); }
.fit .bar i { position: absolute; left: 0; bottom: -2px; height: 4px; background: var(--accent); }
.pieces { display: grid; gap: 8px; }
.piece { display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; }
.piece .pn { font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14px; }
.notes li { padding-left: 16px; position: relative; }
.notes li::before { content: ""; position: absolute; left: 0; top: .6em; width: 8px; height: 2px; background: var(--ok); }
.notes li.w { color: var(--warn); }
.notes li.w::before { background: var(--warn); }
.acc { display: flex; flex-wrap: wrap; gap: 6px; }
.acc span { font-size: 13px; border: 1px solid var(--line); border-radius: 3px; padding: 3px 8px; display: inline-flex; align-items: center; gap: 6px; }
.acc i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 1px rgba(128,128,128,.5); }

/* Sheet */
.backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(8,14,22,.55); display: grid; align-items: end; }
.sheet { background: var(--surface); border-top: 3px solid var(--accent); max-height: 92vh; overflow: auto; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); width: 100%; max-width: 720px; margin: 0 auto; border-radius: 8px 8px 0 0; }
.sheet h2 { font-family: var(--f-display); font-stretch: 112%; font-size: 22px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--ctl); color: var(--ctl-ink); padding: 10px 16px; border-radius: 4px; font-size: 14px; max-width: calc(100vw - 32px); }

/* Mehr */
.todo { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.todo:last-child { border-bottom: 0; }
.dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 2px; }
.dot.ok { background: var(--ok); border-color: var(--ok); }
.matrix { display: grid; grid-template-columns: minmax(84px, 1.4fr) repeat(4, 1fr); gap: 3px; font-size: 12px; }
.matrix .h { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); align-self: end; text-align: center; }
.matrix .lv { align-self: center; }
.matrix .c { height: 26px; border-radius: 2px; background: var(--line); }
.matrix .c.g1 { background: color-mix(in srgb, var(--accent) 55%, var(--raised)); }
.matrix .c.g2 { background: var(--ok); }
.verdict { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 20px; }
.banner { border: 1px dashed var(--muted); border-radius: 6px; padding: 12px 14px; display: grid; gap: 10px; background: var(--surface); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); }
.dim { opacity: .55; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (min-width: 560px) { .closet { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); } }

/* ---- ui.css ---- */
/* Ergänzungen zu styles.css: nur was die Oberfläche zusätzlich braucht. Farben ausschließlich über Tokens. */
:root { --tape-sel: #131E2B; --tape-sel-ink: #E3B23A; --shade: rgba(19,30,43,.06); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --tape-sel: #241A05; --tape-sel-ink: #F0C75A; --shade: rgba(0,0,0,.25); }
}
:root[data-theme="dark"] { --tape-sel: #241A05; --tape-sel-ink: #F0C75A; --shade: rgba(0,0,0,.25); }

[hidden] { display: none !important; }
html { -webkit-tap-highlight-color: transparent; }
header.top { max-width: 720px; margin: 0 auto; }
.panel:focus { outline: none; }
.stack > *, .sec > * { min-width: 0; }
.vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sec > h2.mono { margin: 0 0 8px; font-weight: 400; }
.mono b { font-weight: 500; color: var(--ink); }
.num { font-variant-numeric: tabular-nums; }

/* Touchziele mindestens 44 px */
.chip, .btn.small, .seg button, .check { min-height: 44px; }
.chip { cursor: pointer; }
.chip.static { cursor: default; }
.chip .ct { font-family: var(--f-mono); font-size: 11px; opacity: .7; }
.seg button { display: inline-flex; align-items: center; justify-content: center; text-align: center; line-height: 1.15; }
nav.tabs { grid-template-columns: repeat(4, minmax(0, 168px)); justify-content: center; }
nav.tabs .ti, nav.tabs svg { width: 22px; height: 22px; display: block; }
.tape button { min-height: 58px; }
.tape button[aria-pressed="true"] { background: var(--tape-sel); color: var(--tape-sel-ink); }
.lvl-hint { margin-top: 2px; }

/* Wetter */
.tempbox { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; align-items: center; }
.tempbox .temp { min-width: 3.6ch; font-variant-numeric: tabular-nums; }
.tempbox .feels { grid-column: 1 / -1; }
.range-scale { display: flex; justify-content: space-between; }
select { appearance: auto; }

/* Wunschteile */
.mustchip { padding-right: 0; gap: 4px; background: var(--surface); }
.mustchip .mono { font-size: 10px; }
.mustchip button { background: none; border: 0; min-width: 40px; min-height: 40px; display: grid; place-items: center; color: var(--muted); border-radius: 4px; }
.mustchip button svg { width: 16px; height: 16px; }
.picks { display: grid; gap: 6px; }
.pick { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 6px 6px; min-height: 52px; }
.pick[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pick .pn { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.pick .pn small { display: block; color: var(--muted); font-size: 12px; }
.pick svg { width: 20px; height: 20px; }

/* Ergebnisse */
.results { scroll-margin-top: 12px; }
.res-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.outfit .o-sub { margin-bottom: 2px; }
.outfit .o-title { overflow-wrap: anywhere; line-height: 1.15; }
.o-head > div:first-child { min-width: 0; }
.fit .mono { font-size: 10px; }
.piece .thumb { width: 52px; }
.piece .pmeta { display: block; margin-top: 2px; }
.tag { font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--accent); color: var(--ink); border-radius: 3px; padding: 0 5px; margin-left: 6px; white-space: nowrap; vertical-align: 1px; }
.notes li.s { color: var(--muted); }
.notes li.s::before { background: var(--muted); }
.o-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.o-actions .btn { flex: 1 1 140px; }
.btn.done { background: transparent; color: var(--ok); border-color: var(--ok); }
.alert { border: 1px solid var(--warn); border-left-width: 4px; border-radius: 6px; padding: 10px 12px; background: var(--raised); }
.alert .notes { font-size: 14px; }

/* Teile-Vorschau: helle Farben bekommen dunkle Musterlinien */
.thumb.light.streifen { background-image: repeating-linear-gradient(90deg, transparent 0 7px, rgba(0,0,0,.16) 7px 9px); }
.thumb.light.karo { background-image: repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.13) 9px 11px), repeating-linear-gradient(0deg, transparent 0 9px, rgba(0,0,0,.13) 9px 11px); }
.thumb.light.print { background-image: radial-gradient(circle at 30% 35%, rgba(0,0,0,.18) 0 14%, transparent 15%); }
.thumb { max-width: 100%; }
.thumb.sm { width: 40px; }
.thumb.lg { width: 112px; }
.gcard { cursor: pointer; }
.gcard .nm small { display: block; color: var(--muted); font-size: 12px; }
.gcard:focus-visible { outline-offset: 3px; border-radius: 4px; }

/* Schrank */
.toolbar { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 3px 2px; margin: -3px -2px; scroll-padding-inline: 2px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chips.scroll .chip { flex: none; }
.banner .row .btn { flex: 1 1 auto; }
.countline { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; min-height: 44px; }

/* Formular im Sheet */
.form { display: grid; gap: 16px; }
.form .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field > span:first-child, .flabel { font-size: 13px; font-weight: 600; }
.photo-row { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center; }
.photo-row .stack { gap: 8px; }
.filebtn { position: relative; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.confirm { border: 1px solid var(--bad); border-radius: 6px; padding: 12px; display: grid; gap: 10px; }
.sheet .foot { position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom, 0px)); background: var(--surface); padding: 10px 0 0; margin-top: 4px; display: grid; gap: 8px; }
.sheet .sw[aria-pressed="true"] { border-color: var(--surface); }
.sw { width: 44px; height: 44px; }

/* Scan */
.scan-preview { display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: start; }
.status { font-size: 14px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.status.busy::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict.t-great, .verdict.t-good { color: var(--ok); }
.verdict.t-low { color: var(--warn); }
.verdict.t-none { color: var(--bad); }
.bars { display: grid; gap: 6px; }
.bars .br { display: grid; grid-template-columns: minmax(96px, 9.5em) 1fr 3.2em; gap: 10px; align-items: center; font-size: 13px; }
.bars .track { height: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 2px; position: relative; overflow: hidden; }
.bars .track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.bars .track i.alt { background: var(--muted); }
.bars .v { font-family: var(--f-mono); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

/* Listen mit Vorschau */
.plist { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; min-height: 44px; }
.prow .pn { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
.prow .pn small { display: block; color: var(--muted); font-size: 12px; }
.prow .end { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.prow .rank { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.prow.ranked { grid-template-columns: 1.8em 40px 1fr; }
.prow label.check { min-height: 40px; }
.minibars { display: grid; gap: 3px; margin-top: 5px; }
.minibars span { display: grid; grid-template-columns: 6.4em 1fr; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 10px; letter-spacing: .04em; color: var(--muted); }
.minibars .track { height: 5px; background: var(--surface); border-radius: 2px; position: relative; overflow: hidden; }
.minibars .track i { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
.minibars .track i.alt { background: var(--muted); }

/* Kompakte Outfit-Zeile (Kapsel, Planer, Tagebuch) */
.mini { display: grid; grid-template-columns: 8px 1fr; gap: 12px; align-items: stretch; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mini:last-child { border-bottom: 0; }
.mini .mspine { display: grid; grid-auto-rows: 1fr; border-radius: 2px; overflow: hidden; min-height: 40px; }
.mini .mspine i { background: var(--c); display: block; }
.mini .mbody { min-width: 0; display: grid; gap: 4px; }
.mini .mnames { line-height: 1.35; overflow-wrap: anywhere; }
.mini .mact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* Mehr */
.subnav { padding: 4px 0 0; }
.matrix .c { display: block; }
.matrix-wrap { overflow-x: auto; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 2px; background: var(--line); display: inline-block; }
.legend i.g1 { background: color-mix(in srgb, var(--accent) 55%, var(--raised)); }
.legend i.g2 { background: var(--ok); }
.kpi { display: flex; gap: 22px; flex-wrap: wrap; align-items: baseline; }
.kpi div { display: grid; }
.kpi b { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.daylist { display: grid; gap: 10px; }
.day h3 { font-family: var(--f-display); font-stretch: 112%; font-size: 17px; }
textarea { min-height: 120px; font-family: var(--f-mono); font-size: 12px; line-height: 1.4; resize: vertical; }
.sync.err { color: var(--warn); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

@media (min-width: 560px) {
  .photo-row, .scan-preview { grid-template-columns: 140px 1fr; }
  .thumb.lg { width: 140px; }
}
</style>
</head>

}

  for (i = 0; i < w; i++) { acc(i, 0); acc(i, hh - 1); }

var MONTH_TEMP = [3, 5, 10, 14, 19, 22, 24, 24, 19, 14, 8, 4];

function defaultCtx() {
  var t = MONTH_TEMP[new Date().getMonth()];
  return { level: 2, temp: t, rain: false, snow: false, wind: false, sun: t >= 20, season: 'auto', transport: 'oepnv',
    factors: [], activity: 'alltag', boldness: 1, onlyBasics: false, must: [], seed: 1 };
}

V.avoid = [];
V.preSportLevel = null;

function seasonOf(c) { return c.season === 'auto' ? AK.seasonFor(c.temp, new Date().getMonth() + 1) : c.season; }
function engineCtx(c, over) {
  var x = {
    level: c.level, weather: { temp: c.temp, rain: !!c.rain, snow: !!c.snow, wind: !!c.wind, sun: !!c.sun },
    transport: c.transport, factors: c.factors.slice(), must: c.must.map(function (m) { return Object.assign({}, m); }),
    boldness: c.boldness, onlyBasics: !!c.onlyBasics, seed: c.seed, today: todayStr(), activity: c.activity, season: seasonOf(c)
  };
  if (over) for (var k in over) x[k] = over[k];
  return x;
}
function isSportAct(id) { var a = AK.ACT[id] || {}; return a.level === 0; }
function mustLabel(m) {
  if (m.kind === 'item') { var it = m.item || itemById(m.id); return it ? it.name : 'Teil'; }
  return typeLabel(m.type) + (m.color ? ' · ' + cname(m.color) : '');
}
function mustSlot(m) {
  if (m.kind === 'item') { var it = m.item || itemById(m.id); return it ? it.slot : null; }
  return AK.TYPES[m.type] ? AK.TYPES[m.type].slot : null;
}
function isWishedFor(ctx) {
  return function (x) {
    return (ctx.must || []).some(function (m) {
      return (m.kind === 'item' && (m.id === x.id || (m.item && m.item.id === x.id))) ||
        (m.kind === 'type' && m.type === x.type && (!m.color || m.color === x.color));
    });
  };
}
/* Ein Wunsch je Slot (außer Accessoires): ein neuer Wunsch ersetzt den alten im selben Slot */
function addMust(m) {
  var slot = mustSlot(m), replaced = null;
  V.ctx.must = V.ctx.must.filter(function (x) {

    if (same) return false;
    if (slot && slot !== 'acc' && mustSlot(x) === slot) { replaced = mustLabel(x); return false; }
    return true;
  });
  V.ctx.must.push(m);

}

function recalc(keepAvoid) {

      h('h3', null, 'Dein Schrank ist noch leer'),
      h('p', { style: 'margin:0' }, 'Lege ein paar Teile an oder fotografiere sie. Für Vorschläge brauchst du mindestens ein Oberteil, eine Hose und Schuhe.'),

    return;

    V.avoid = [];
    r = AK.suggest(W, ctx, { n: 3, cap: 8 });

  }
  V.results = { res: r, ctx: ctx };
  var summary = [levelName(ctx.level), fmtT(ctx.weather.temp)];

  var ex = h('div', { class: 'card stack' },
    h('div', { class: 'muted small' }, 'Sichert Teile (mit Fotos), Tagebuch und Einstellungen als JSON-Text.' + (IN_CLAUDE ? ' Kopiere den Text und bewahre ihn auf.' : '')),
    h('button', { class: 'btn', type: 'button', id: 'set-export-go', onclick: function () { exTa.value = exportData(); exBox.hidden = false; exTa.focus(); } }, ico('down'), 'Export erstellen'),
    exBox);

  var imTa = h('textarea', { id: 'set-import', rows: '4', placeholder: 'Export-JSON hier einfügen', 'aria-label': 'Daten zum Importieren' });
  var imFile = h('input', { type: 'file', accept: 'application/json,.json,text/plain', id: 'set-import-file', class: 'vh' });
  imFile.addEventListener('change', function () {
    var f = imFile.files && imFile.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () { imTa.value = String(rd.result || ''); toast('Datei geladen. Tippe auf „Importieren“.'); };
    rd.onerror = function () { toast('Die Datei ließ sich nicht lesen.'); };
    rd.readAsText(f); imFile.value = '';
  });
  var im = h('div', { class: 'card stack' },
    h('div', { class: 'muted small' }, 'Fügt Teile und Tagebuch aus einem Export hinzu. Teile mit gleicher Kennung werden überschrieben.'),
    h('label', { class: 'btn ghost small filebtn' }, ico('up'), 'Datei wählen', imFile),
    imTa,
    h('button', { class: 'btn', type: 'button', id: 'set-import-go', onclick: function () {
      if (!imTa.value.trim()) { toast('Füge zuerst einen Export ein oder wähle eine Datei.'); return; }
      var r = importData(imTa.value);
      if (r.err) { toast(r.err); return; }
      imTa.value = '';
      toast(r.items + ' Teile und ' + r.diary + ' Tagebucheinträge importiert' + (r.skipped ? ', ' + r.skipped + ' ungültige übersprungen' : '') + '.');
      changed();
    } }, ico('up'), 'Importieren'));
  box.append(sec('Export', ex), sec('Import', im));

  box.append(sec('Daten löschen', h('div', { class: 'card stack' },
    h('div', { class: 'muted small' }, 'Löscht alle Teile, Fotos, das Tagebuch, Gemerktes und Einstellungen ' + (S.mode === 'db' ? 'in deinem Konto.' : 'in diesem Browser.')),
    confirmBtn('Alle Daten löschen', 'Wirklich alles löschen? Das lässt sich nicht rückgängig machen. Exportiere vorher, wenn du etwas behalten willst.', 'Ja, alles löschen', function () {
      wipeAll(); toast('Alle Daten gelöscht.'); changed();
    }))));
}
;
/* ---- Start ---- */
initApp();
Promise.resolve().then(function () { return Store.init(); }).catch(function (e) {
  try { console.warn("Ankleide: Speicher nicht verfügbar", e); } catch (x) {}
  S.mode = "local"; S.ready = true; onData();
});
</script>
</body>
</html>
